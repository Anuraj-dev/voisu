name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test gate (workspace + 3x flake gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install --yes libxkbcommon-dev
      # Floats on @stable; the MSRV job pins 1.92.0. Pin both together.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The standalone tools/transcript-quality workspace has its own target.
          workspaces: |
            .
            tools/transcript-quality
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # One process per test, no retries (a flake fails the gate), no doctests.
      - name: Workspace suite
        run: cargo nextest run --workspace --locked
      # Two more voisu-app passes make three. A filterset keeps the workspace
      # feature set, so these reuse the build; `-p voisu-app` would rebuild.
      - name: Flake gate (2 more voisu-app passes)
        run: for i in 1 2; do cargo nextest run --workspace --locked -E 'package(voisu-app)'; done
      - name: Doctests
        run: cargo test --doc --workspace --locked
      # dpr-eval-late-retain code exists only under that voisu-core feature;
      # tools/transcript-quality sits outside the root workspace.
      - name: Feature-gated and standalone suites
        run: |
          cargo nextest run -p voisu-core --features dpr-eval-late-retain --locked
          cargo test --manifest-path tools/transcript-quality/Cargo.toml --locked
      - name: Packaging shell suites
        run: |
          bash packaging/tests/hyprland-release-gate.sh
          bash packaging/tests/local-asr-release-gate.sh

  clippy:
    name: Lint gate (clippy -D warnings, default + overlay)
    # libgtk4-layer-shell-dev (required to compile the `overlay` feature)
    # first ships in Ubuntu 25.10 (universe); the 24.04 image that
    # ubuntu-latest points to has only the GTK3 variant — release.yml uses an
    # ubuntu:26.04 container for the same reason. NOTE: the ubuntu-26.04
    # runner label is Public Preview (GitHub changelog 2026-06-11); if it is
    # ever withdrawn, switch these jobs to ubuntu-latest + `container:
    # ubuntu:26.04` (the release.yml pattern).
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libxkbcommon-dev libgtk-4-dev libgtk4-layer-shell-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # See the test job: the standalone tool crate keeps its own target dir.
          workspaces: |
            .
            tools/transcript-quality
      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --all-targets --workspace --locked -- -D warnings
      # The shipped voisu-overlay binary is feature-gated; without this pass
      # all overlay-only code ships unlinted.
      - name: Clippy overlay feature (all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets --features overlay --locked -- -D warnings
      # Standalone crate excluded from the root workspace; gated here with the
      # same -D warnings policy as the workspace itself.
      - name: Clippy transcript-quality (--locked)
        run: cargo clippy --manifest-path tools/transcript-quality/Cargo.toml --locked --all-targets -- -D warnings

  fmt:
    name: Format gate (rustfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check (all crates)
        run: cargo fmt --all -- --check
      # tools/transcript-quality is excluded from the root workspace and
      # declares its own, so `cargo fmt --all` cannot see it from the root.
      - name: Format check (tools/transcript-quality)
        run: cargo fmt --manifest-path tools/transcript-quality/Cargo.toml -- --check

  audit:
    name: Advisory gate (cargo-audit vs Cargo.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Prebuilt cargo-audit binary — no from-source compile, cached by the
      # install-action. Chosen over rustsec/audit-check because it behaves
      # identically on push and pull_request (audit-check's annotation path
      # diverges by event and silently no-ops on fork PRs), needs no
      # GITHUB_TOKEN, and lets us pin explicit --ignore exceptions inline.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Audits the committed Cargo.lock against the RustSec advisory DB.
      # --deny warnings escalates unmaintained/yanked notices to failures too.
      # Document any accepted advisory here with a trailing --ignore RUSTSEC-YYYY-NNNN
      # (with a comment justifying the exception) rather than silencing the whole job.
      # RUSTSEC-2026-0370/0371/0372: informational "unmaintained" notices, not
      # vulnerabilities. zvariant, zvariant_derive and zbus_names were folded
      # into zbus 6. They come in only through zbus 5 (voisu-app's portal and
      # session code); drop these ignores when that code moves to zbus 6.
      # RUSTSEC-2026-0574..0582: heapless 0.8.0, pulled only by flacenc 0.5.1
      # (voisu-cloud's FLAC upload encoder; 0.5.1 is the latest flacenc). They
      # cover IndexMap, Deque, SortedLinkedList, Spsc, the treiber pool and
      # panicking element Drop. flacenc uses only heapless::Vec of plain
      # integers, so none of them is reachable. Drop these when flacenc moves
      # to heapless >= 0.9.4.
      - name: cargo audit
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2026-0370
          --ignore RUSTSEC-2026-0371
          --ignore RUSTSEC-2026-0372
          --ignore RUSTSEC-2026-0574
          --ignore RUSTSEC-2026-0575
          --ignore RUSTSEC-2026-0576
          --ignore RUSTSEC-2026-0577
          --ignore RUSTSEC-2026-0578
          --ignore RUSTSEC-2026-0579
          --ignore RUSTSEC-2026-0580
          --ignore RUSTSEC-2026-0581
          --ignore RUSTSEC-2026-0582
      # tools/transcript-quality keeps its own Cargo.lock (excluded from the
      # root workspace), so its dependency set needs its own audit pass.
      - name: cargo audit (tools/transcript-quality lockfile)
        run: cargo audit --file tools/transcript-quality/Cargo.lock --deny warnings

  doc:
    name: Doc gate (rustdoc -D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install native doc dependencies
        run: sudo apt-get update && sudo apt-get install --yes libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links (e.g. public docs linking private items) fail
      # the build instead of silently shipping broken rustdoc pages.
      - name: cargo doc (warnings are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

  windows:
    name: Windows portability gate (voisu-core + voisu-cloud)
    # Only the portable crates: voisu-app is the Linux daemon (pw-record,
    # Unix sockets, secret-tool, libei, portal) and does not build here. The
    # Local worker (voisu-local-asr + whisper.cpp) ships in the Windows app
    # (ADR 0014), so it is linted and its process tests run here too.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Clippy, not check: cfg(windows) branches are linted nowhere else.
      - name: Clippy portable crates (all targets, warnings are errors)
        run: cargo clippy -p voisu-core -p voisu-cloud --all-targets --locked -- -D warnings
      - name: Test portable crates (--locked)
        run: cargo test -p voisu-core -p voisu-cloud --locked
      # MSVC build of whisper.cpp; the process tests spawn the real worker
      # exe, so its DLLs load from beside it. The golden suites stay on Linux.
      - name: Clippy Local worker (all targets, warnings are errors)
        run: cargo clippy -p voisu-whisper-sys -p voisu-local-asr --all-targets --locked -- -D warnings
      - name: Test whisper.cpp bindings (--locked)
        run: cargo test -p voisu-whisper-sys --locked
      - name: Test Local worker (--locked)
        run: cargo test -p voisu-local-asr --locked --lib --bins --test process

  msrv:
    name: MSRV gate (1.92.0 workspace check)
    # Same native-dependency reason as the clippy job: the overlay check needs
    # libgtk4-layer-shell-dev, which only exists from Ubuntu 26.04 on.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libxkbcommon-dev libgtk-4-dev libgtk4-layer-shell-dev
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      # rust-version declared in the workspace Cargo.toml; prove the declared
      # MSRV actually builds the shipped dependency set, overlay included.
      - name: Workspace check (--locked)
        run: cargo check --workspace --locked
      - name: Overlay feature check (--locked)
        run: cargo check -p voisu-app --features overlay --locked
