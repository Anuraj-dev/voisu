name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test gate (workspace + 3x flake gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install --yes libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # tools/transcript-quality is a standalone workspace (own Cargo.lock
          # and target dir); cache it alongside the root workspace.
          workspaces: |
            .
            tools/transcript-quality
      - name: Workspace suite
        run: cargo test --workspace
      # The dpr-eval-late-retain tests are feature-gated in voisu-core
      # (src/dpr_diagnostics.rs, tests/dpr_diagnostics.rs) and were never run
      # by the default-feature suite above.
      - name: dpr-eval-late-retain feature suite
        run: cargo test -p voisu-core --features dpr-eval-late-retain
      # Standalone crate excluded from the root workspace: `cargo test
      # --workspace` cannot see it from the root, so run it via --manifest-path.
      - name: transcript-quality suite (--locked)
        run: cargo test --manifest-path tools/transcript-quality/Cargo.toml --locked
      - name: Hyprland release-gate shell suite
        run: bash packaging/tests/hyprland-release-gate.sh
      - name: Flake gate — 3 consecutive parallel voisu-app runs
        run: |
          for i in 1 2 3; do
            echo "::group::flake run $i"
            cargo test -p voisu-app
            echo "::endgroup::"
          done

  clippy:
    name: Lint gate (clippy -D warnings, default + overlay)
    # libgtk4-layer-shell-dev (required to compile the `overlay` feature)
    # first ships in Ubuntu 26.04; the 24.04 image that ubuntu-latest points
    # to has no such package — release.yml uses an ubuntu:26.04 container for
    # the same reason.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libxkbcommon-dev libgtk-4-dev libgtk4-layer-shell-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # See the test job: the standalone tool crate keeps its own target dir.
          workspaces: |
            .
            tools/transcript-quality
      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --all-targets --workspace -- -D warnings
      # The shipped voisu-overlay binary is feature-gated; without this pass
      # all overlay-only code ships unlinted.
      - name: Clippy overlay feature (all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets --features overlay -- -D warnings
      # Standalone crate excluded from the root workspace; gated here with the
      # same -D warnings policy as the workspace itself.
      - name: Clippy transcript-quality (--locked)
        run: cargo clippy --manifest-path tools/transcript-quality/Cargo.toml --locked --all-targets -- -D warnings

  fmt:
    name: Format gate (rustfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check (all crates)
        run: cargo fmt --all -- --check
      # tools/transcript-quality is excluded from the root workspace and
      # declares its own, so `cargo fmt --all` cannot see it from the root.
      - name: Format check (tools/transcript-quality)
        run: cargo fmt --manifest-path tools/transcript-quality/Cargo.toml -- --check

  audit:
    name: Advisory gate (cargo-audit vs Cargo.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Prebuilt cargo-audit binary — no from-source compile, cached by the
      # install-action. Chosen over rustsec/audit-check because it behaves
      # identically on push and pull_request (audit-check's annotation path
      # diverges by event and silently no-ops on fork PRs), needs no
      # GITHUB_TOKEN, and lets us pin explicit --ignore exceptions inline.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Audits the committed Cargo.lock against the RustSec advisory DB.
      # --deny warnings escalates unmaintained/yanked notices to failures too.
      # Document any accepted advisory here with a trailing --ignore RUSTSEC-YYYY-NNNN
      # (with a comment justifying the exception) rather than silencing the whole job.
      - name: cargo audit
        run: cargo audit --deny warnings
      # tools/transcript-quality keeps its own Cargo.lock (excluded from the
      # root workspace), so its dependency set needs its own audit pass.
      - name: cargo audit (tools/transcript-quality lockfile)
        run: cargo audit --file tools/transcript-quality/Cargo.lock --deny warnings

  doc:
    name: Doc gate (rustdoc -D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install native doc dependencies
        run: sudo apt-get update && sudo apt-get install --yes libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links (e.g. public docs linking private items) fail
      # the build instead of silently shipping broken rustdoc pages.
      - name: cargo doc (warnings are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  msrv:
    name: MSRV gate (1.92.0 workspace check)
    # Same native-dependency reason as the clippy job: the overlay check needs
    # libgtk4-layer-shell-dev, which only exists from Ubuntu 26.04 on.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libxkbcommon-dev libgtk-4-dev libgtk4-layer-shell-dev
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      # rust-version declared in the workspace Cargo.toml; prove the declared
      # MSRV actually builds the shipped dependency set, overlay included.
      - name: Workspace check (--locked)
        run: cargo check --workspace --locked
      - name: Overlay feature check (--locked)
        run: cargo check -p voisu-app --features overlay --locked
