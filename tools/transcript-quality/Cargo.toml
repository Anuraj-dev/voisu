[package]
name = "transcript-quality"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"
publish = false
description = "Private developer evaluator for saved Recordings (not packaged)"

# Standalone package: must not join the repo workspace (RPM `cargo --workspace`
# would otherwise build and test this developer tool).
[workspace]

[[bin]]
name = "transcript-quality"
path = "src/main.rs"

[[bin]]
name = "mark-last"
path = "src/bin/mark-last.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
voisu-core = { path = "../../crates/voisu-core" }
