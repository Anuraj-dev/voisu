[package]
name = "voisu-local-asr"
version = "0.86.0"
description = "Voisu's private Local speech-to-text worker (whisper.cpp, worker protocol v1)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "voisu-local-asr"
path = "src/main.rs"

[dependencies]
regex = "1.13.1"
serde_json = "1"
sha2 = "0.10"
voisu-core = { path = "../voisu-core" }
voisu-whisper-sys = { path = "../voisu-whisper-sys" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# ggml's Vulkan backend; see voisu-whisper-sys.
vulkan = ["voisu-whisper-sys/vulkan"]
