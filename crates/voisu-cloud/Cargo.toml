[package]
name = "voisu-cloud"
version = "0.68.0"
description = "Portable cloud transcription pipeline for Voisu"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# No default TLS stack; Rustls only (ring via rustls-no-provider + the rustls
# ring feature), JSON bodies enabled.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Parsed-host endpoint policy: prefix matching on raw endpoint strings is
# bypassable, so the transport checks parse first.
url = "2"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
voisu-core = { path = "../voisu-core" }
flacenc = { version = "0.5.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
bytes = "1"
http-body = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tungstenite = "0.24"
